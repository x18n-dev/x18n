ignoreWorkspaceRootCheck: true
catalogMode: prefer
# The `comark-docs` layer (docs site theme, installed from GitHub) pins its
# `comark` deps to pkg.pr.new snapshot URLs, which pnpm blocks by default.
blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/skills@0.1.0'
  - '@devframes/agentic@1.2.5'
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - turbo@2.11.10
  - eslint-plugin-antfu@3.3.1
  - '@x18n/builtins@0.1.5'
  - '@x18n/core@0.1.5'
  - '@x18n/lsp@0.1.5'
  - '@x18n/node@0.1.5'
  - '@x18n/ui@0.1.5'

trustPolicy: no-downgrade
# Older releases of Nuxt and comark-docs dependencies predate provenance publishing;
# only releases from the last 30 days must keep their trust level.
trustPolicyIgnoreAfter: 43200
# Recent releases that dropped provenance (cssnano monorepo, comark-docs deps).
trustPolicyExclude:
  - stylehacks@9.0.8
  - postcss-unique-selectors@9.0.6
  - postcss-reduce-transforms@9.0.6
  - postcss-reduce-initial@9.0.7
  - postcss-ordered-values@9.0.9
  - postcss-normalize-whitespace@9.0.8
  - postcss-normalize-url@10.0.0
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-charset@9.0.6
  - postcss-minify-selectors@9.0.8
  - postcss-minify-params@9.1.0
  - postcss-minify-gradients@9.0.8
  - postcss-minify-font-values@9.0.9
  - postcss-merge-rules@9.1.5
  - postcss-merge-longhand@9.4.0
  - postcss-discard-overridden@9.0.6
  - postcss-discard-empty@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-comments@9.0.8
  - postcss-convert-values@9.1.0
  - postcss-colormin@9.0.8
  - cssnano-utils@9.0.0
  - cssnano-preset-default@9.8.0
  - cssnano@9.8.0

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*
  - docs

# nuxt-og-image (via comark-docs) requires a satori without GHSA-wx4j-mvgx-mqwp.
overrides:
  satori: 'catalog:docs'

allowBuilds:
  '@parcel/watcher': false
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: false
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.0
    skills: ^1.7.4
  build:
    nuxt: ^4.6.2
    tsdown: ^0.23.1
    turbo: ^2.11.10
    vue-tsc: ^3.3.13
  cli:
    '@antfu/eslint-config': ^9.5.1
    bumpp: ^12.3.0
    eslint: ^10.13.0
    eslint-plugin-antfu: ^3.3.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.42.1
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.4
  deps:
    '@devframes/agentic': 1.2.5
    '@devframes/vite': 1.2.5
    '@oxc-parser/binding-wasm32-wasip1': ^0.155.0
    '@valibot/to-json-schema': ^1.8.0
    '@vitejs/devtools-kit': ^0.8.0
    '@vue/compiler-core': ^3.5.44
    '@vue/compiler-sfc': ^3.5.44
    cac: ^7.1.0
    chokidar: ^6.0.0
    devframe: ^1.2.6
    ignore: ^7.0.13
    jiti: ^2.7.0
    json5: ^2.2.3
    jsonc-parser: ^3.3.1
    nostics: ^1.3.0
    oxc-parser: ^0.155.0
    svelte: ^5.57.2
    tinyglobby: ^0.2.17
    valibot: ^1.5.0
    vscode-languageserver: ^10.1.2
    vscode-languageserver-textdocument: ^1.0.15
    yaml: ^2.9.1
  docs:
    comark-docs: github:comarkdown/comark-docs#f97dc864b0aa702d54c600f868589b7a2c185b3a
    satori: ^0.63.0
  frontend:
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/circle-flags': ^1.2.12
    '@iconify-json/devicon': ^1.2.71
    '@iconify-json/logos': ^1.2.17
    '@iconify-json/ph': ^1.2.2
    '@unocss/nuxt': ^66.11.0
    '@unocss/reset': ^66.11.0
    '@vueuse/core': ^15.0.0
    unocss: ^66.11.0
    vue: ^3.5.44
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    # 1.63 drives the browsers preinstalled in the dev container (chromium 1243).
    '@playwright/test': ~1.64.1
    '@vitejs/devtools': ^0.8.0
    tsnapi: ^1.5.0
    vitest: ^5.0.5
    vscode-jsonrpc: ^9.0.3
  types:
    '@types/node': ^26.6.5
    '@types/vscode': ~1.140.0
  vscode:
    '@vscode/test-electron': ^3.1.0
    '@vscode/vsce': ^4.0.0
    ovsx: ^1.3.0
    reactive-vscode: ^1.0.2
    vscode-ext-gen: ^1.6.0
    vscode-languageclient: ^10.1.2
    vsxpub: ^0.2.0
  zed:
    '@x18n/lsp': ^0.1.5
